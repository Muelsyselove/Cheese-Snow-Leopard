llm:
  api_base: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  temperature: 0.3
  max_tokens: 4096
  timeout: 60
  api_key: keyring:llm_api_key_deepseek
encoding:
  worker_id: 1
paths:
  data_root: null
vlm:
  provider: B
  paddleocr_vl:
    model_dir: null
    lang: ch
  mineru_vlm:
    backend: pipeline
    device: cuda
  minicpm_v:
    model_path: openbmb/MiniCPM-V-4_5
    quantization: awq
embedding:
  provider: A
  bge_m3:
    model_name: BAAI/bge-m3
    use_fp16: true
  qwen3:
    model_name: Qwen/Qwen3-Embedding-0.6B
    max_length: 8192
    query_instruction: 'Instruct: Given a web search query, retrieve relevant passages
      that answer the query.

      query: '
storage:
  minio:
    endpoint: localhost:9000
    access_key: keyring:minio_access_key
    bucket: knowledge-base
    secret_key: keyring:minio_secret_key
  postgres:
    host: localhost
    port: 5432
    database: knowledge_base
    user: admin
    password: keyring:pg_password
  qdrant:
    host: localhost
    port: 6333
    collection: text_chunks
chunking:
  target_tokens: 300
  overlap_ratio: 0.15
  min_chunk_tokens: 50
retrieval:
  top_k_dense: 20
  top_k_sparse: 20
  rrf_k: 60
  final_top_k: 5
concurrency:
  max_gpu_tasks: 1
  llm_rpm: 60
  llm_tpm: 90000
  import_queue_size: 16
compute:
  device: auto
ui:
  window_width: 1400
  window_height: 900
  theme: dark
  language: zh_CN
services:
  postgresql:
    home: D:\doit\PostgreSQL16
  qdrant:
    home: D:\doit\Qdrant
  minio:
    home: D:\doit\MinIO
default_models:
  chat:
  - deepseek
  - deepseek-v4-flash
  knowledge_base:
  - deepseek
  - deepseek-v4-flash
  auto_naming:
  - deepseek
  - deepseek-v4-flash
